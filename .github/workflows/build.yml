# Da salvare nel repository come:  .github/workflows/build.yml
name: Build ArtNet Stage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Compila (universale: Apple Silicon + Intel)"
        run: UNIVERSAL=1 NO_OPEN=1 bash build_app.sh

      - name: Crea lo zip dell'app (conserva i permessi)
        run: ditto -c -k --keepParent ArtNetStage.app ArtNetStage-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArtNetStage-mac
          path: ArtNetStage-mac.zip
